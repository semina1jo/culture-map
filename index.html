<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFAF3"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="컬처맵"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>컬처맵 · 가성비 문화 혜택 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&text=%EC%BB%AC%EC%B2%98%EB%A7%B5&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 전체 화면 지도 위에 헤더·필터칩·떠 있는 버튼·하단 메뉴. 다른 탭은 지도 위 전체 페이지, 카드·시트는 아래에서 올라옴 */
:root{
  color-scheme:light;
  /* 컬처맵 팔레트: 짙은 숲색 잉크 + 올리브 포인트 + 따뜻한 종이색. 가격 단계는 민트(무료)·레몬(저가)·라일락(만 원 이하) */
  --ink:#1F2B22; --ink2:#4A584D; --muted:#8B958C; --line:#E6EADF; --chip:#F1F4EA; --white:#fff; --outer:#E4E9DC;
  --accent:#6F8F2E; --accent-soft:#EDF3DC; --paper:#FFFAF3; --grn:#0E9F75;
  --gold:#F0A500; --gold-soft:#FFF3CC; --green:#13B386; --green-soft:#DDF6EC; --blue:#7B61FF; --blue-soft:#EEEAFF; --red:#F0445A; --red-soft:#FFE5E9;
  --map-land:#f3f2ee; --map-road:#fff; --map-case:#e4e1da; --map-park:#d6ead0; --map-water:#cde2f4; --map-label:#9a9a9a;
  --f:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{position:relative;height:100%;max-height:880px;max-width:420px;margin:0 auto;overflow:hidden;border-radius:24px;background:var(--map-land);box-shadow:0 10px 40px rgba(0,0,0,.18)}
/* 휴대폰에서는 가상 폰 테두리 없이 화면 전체를 쓴다 */
@media (max-width:520px), (max-height:500px) and (pointer:coarse){
  body{padding:0}
  .app{max-width:none;max-height:none;height:100%;border-radius:0;box-shadow:none}
}
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none}
.gmap{position:absolute;inset:0 0 70px;background:var(--map-land);z-index:0}
.gmap.ready{background:transparent}
.mapStatus{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:1;background:rgba(255,255,255,.92);border-radius:12px;padding:9px 12px;color:var(--ink2);font-size:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:230px}
.world{z-index:2;pointer-events:none}
.pin{pointer-events:auto}
.me-dot{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%) scale(var(--inv,1));z-index:3;pointer-events:none}
.me-dot i{position:relative;display:block;width:100%;height:100%;border-radius:50%;background:#2f7bf6;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);box-sizing:border-box}
.me-dot::before{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(47,123,246,.18);animation:mePulse 2s ease-out infinite}
.me-dot.demo i{background:#7a5cf0}
.me-dot.demo::before{background:rgba(122,92,240,.18)}
@keyframes mePulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1);opacity:0}}
.map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1000px;height:1400px;transform-origin:0 0;will-change:transform}
.world svg{position:absolute;left:0;top:0;width:1000px;height:1400px}
.r-case{stroke:var(--map-case);fill:none;stroke-linecap:round}
.r-road{stroke:var(--map-road);fill:none;stroke-linecap:round}
.park{fill:var(--map-park)} .water{fill:var(--map-water)}
.lbl{fill:var(--map-label);font-size:11px;font-family:var(--f)}
.stn{fill:#fff;stroke:#666;stroke-width:1.5}

.head{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 16px 10px;background:linear-gradient(#fff 72%,rgba(255,255,255,0))}
.title{display:flex;align-items:center;justify-content:space-between}
.title h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.demo{font-size:10.5px;color:var(--muted);margin-left:8px;font-weight:500;vertical-align:middle;border:1px solid var(--line);border-radius:6px;padding:1px 5px;letter-spacing:0}
.round{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center;position:relative}
.round svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
.layers{display:flex;gap:16px;margin:10px 2px 8px}
.layers button{border:0;background:none;padding:2px 0;font-size:15px;font-weight:700;color:var(--muted);position:relative}
.layers button[aria-pressed="true"]{color:var(--ink)}
.layers button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2.5px;border-radius:2px;background:var(--ink)}
.new{font-size:9.5px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:0 4px;margin-left:3px;vertical-align:3px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.13);border-radius:12px;height:38px;padding:0 12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.chip .car{width:12px;height:12px;stroke-width:2.4}
.chip.icon{width:38px;padding:0;justify-content:center}
.chip.on{background:var(--ink);color:#fff}
.chip.on svg{stroke:#fff}

.pin{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .p{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--bd);border-radius:999px;padding:3px 11px 3px 5px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.pin .e{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:12px}
.pin .s{margin-top:-3px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--ink2)}
.pin.sel{z-index:4}
.pin.sel .p{background:var(--ink);color:#fff;border-color:var(--ink)}
.pin.rep .p{border-style:dashed}
/* 문화 탭: 예시(데모) 데이터는 연하게, 공공 API 데이터가 위로 */
.pin.demo{opacity:.75;z-index:1}
.pin.demo.sel{opacity:1;z-index:4}
.listitem.demo{opacity:.75}
.t-free{--bd:var(--green);--bg2:var(--green-soft)}
.t-low{--bd:var(--gold);--bg2:var(--gold-soft)}
.t-mid{--bd:var(--blue);--bg2:var(--blue-soft)}
.t-unknown{--bd:#aaa;--bg2:#f1f1f1}
.more{position:absolute;left:50%;top:205px;transform:translateX(-50%);z-index:4;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.stack{position:absolute;right:12px;top:200px;z-index:4;display:flex;flex-direction:column;gap:8px}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.bottomctl{position:absolute;left:12px;right:12px;bottom:76px;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.bottomctl > *{pointer-events:auto}
.plus{width:52px;height:52px;border-radius:16px;border:0;background:var(--ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.plus svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none}
.plus-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.plus-wrap span{font-size:11px;font-weight:700;background:#fff;border-radius:999px;padding:1px 8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.legend{position:absolute;left:12px;bottom:138px;z-index:3;background:#fff;border-radius:10px;padding:4px 9px;font-size:11px;color:var(--ink2);box-shadow:0 1px 5px rgba(0,0,0,.12);display:flex;gap:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:2px solid var(--bd);background:var(--bg2);vertical-align:-1px}

.nav{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:8px 0 12px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:500}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}

.peek{position:absolute;left:12px;right:12px;bottom:76px;z-index:7;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;display:grid;grid-template-columns:72px 1fr;gap:4px 14px}
.peek .ph{grid-row:span 2;width:72px;height:72px;border-radius:12px;display:grid;place-items:center;font-size:30px;background:var(--bg2)}
.peek .nm{font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:8px;min-width:0}
.peek .nm span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;padding:0;width:26px;height:26px;flex:none;display:grid;place-items:center}
.x svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2;fill:none}
.peek .sub{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.peek .sub small{color:var(--ink2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .sub b{font-size:21px;font-weight:800;white-space:nowrap}
.peek .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.peek .foot span{color:var(--muted);font-size:12.5px}
.blk{border:0;background:var(--ink);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.out{border:1px solid var(--line);background:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.out.on{border-color:var(--ink);background:var(--chip)}
.sm{padding:7px 12px;font-size:13px;border-radius:10px}

.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 18px 22px}
.grab{width:38px;height:4px;border-radius:2px;background:#d5d5d5;margin:2px auto 14px}
.scrim.detail-scrim{background:transparent;pointer-events:none}
.detail-scrim .place-sheet{height:50%;max-height:100%;overflow-y:hidden;pointer-events:auto;overscroll-behavior:contain;touch-action:none;transition:height .2s ease}
.detail-scrim .place-sheet.full{height:100%;overflow-y:auto;touch-action:pan-y}
.place-sheet .grab{touch-action:none;cursor:grab}
.benefit-prompt{width:100%;display:flex;align-items:center;justify-content:center}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-h h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.addr{color:var(--ink2);font-size:13.5px;margin:4px 0 12px}
.hero{height:132px;min-height:132px;max-height:132px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden;isolation:isolate}
.hero .badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;z-index:1}
.hero .price{position:absolute;right:12px;bottom:10px;background:#fff;border-radius:10px;padding:2px 10px;font-size:20px;font-weight:800;z-index:1}
.hero img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;border-radius:14px;z-index:0}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.adds button{border:0;background:none;font-size:13px;font-weight:500;color:var(--ink2);padding:2px 0;margin-right:6px}
.rows{border-top:1px solid var(--line);margin-top:10px}
.rowi{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowi svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;margin-top:1px}
.rowi small{display:block;color:var(--muted);font-size:12px}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.cmt{background:var(--chip);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:6px}
.cmt small{display:block;color:var(--muted);font-size:11.5px}
.addc{display:flex;gap:6px;margin-top:8px}
.cmt-star{color:#f5a623;font-weight:800}
.addr-star{color:var(--gold);font-weight:800}
.addr-cnt{color:var(--muted);margin-left:2px}
.sr-top{display:flex;align-items:center;gap:10px;position:sticky;top:-1px;background:var(--bg,#fff);padding:4px 0 10px;z-index:2}
.sr-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px}
.sr-field svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.sr-field input{flex:1;border:0;background:none;padding:12px 0;font-size:15px;outline:none;min-width:0}
.sr-cancel{border:0;background:none;font-weight:700;color:var(--ink2);padding:8px 2px}
.sr-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;color:var(--ink2);margin:14px 0 6px}
.sr-h span{color:var(--muted);font-weight:700;margin-left:4px;margin-right:auto}
.sr-clear{border:0;background:none;color:var(--muted);font-size:12px}
.sr-chips{display:flex;flex-wrap:wrap;gap:6px}
#srRes{min-height:62vh}
.rv-sum{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border-radius:14px;padding:14px 16px;margin:4px 0 12px}
.rv-avg{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em}
.rv-avg.muted{color:var(--muted)}
.rv-sum-stars{color:var(--gold);font-size:22px;letter-spacing:2px;line-height:1.1}
.rv-sum small{color:var(--ink2);font-size:13px;font-weight:600}
.rv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.rv-bar .seg2{margin:0;flex:0 0 150px}
.rv-bar .seg2 button{padding:6px 0;font-size:12.5px}
.rv{border-bottom:1px solid var(--line);padding:10px 0}
.rv-h{display:flex;align-items:center;gap:8px}
.rv-h b,.rv.mini b{font-size:13.5px}
.rv-star{color:var(--gold);letter-spacing:1px;font-size:13px}
.rv p{margin:4px 0 2px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.rv-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rv small{color:var(--muted);font-size:12px}
.rv.mini{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rv.mini .rv-acts{margin-left:auto}
.rv-acts{display:inline-flex;align-items:center;gap:6px}
.rv-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--ink2)}
.rv-btn.on{border-color:#e0245e;color:#e0245e}
.rv-btn:disabled{opacity:.5}
.rv-sample{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.rv-likes{font-size:12px;color:var(--muted)}
.wallet.guest .row{display:none}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.g-logo{width:18px;height:18px;flex:none}
.or-line{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--muted);font-size:12px}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
.addc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.votes.two{grid-template-columns:1fr 1fr}
.votes button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;font-size:12px;font-weight:500}
.votes b{display:block;font-size:16px;font-weight:800}
.status{margin-top:8px;font-size:12.5px;background:var(--green-soft);color:#1e6b41;border-radius:10px;padding:7px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acts .w{grid-column:1/-1}
.acts-row{grid-column:1/-1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.acts-row .out{padding:11px 6px;white-space:nowrap}
.acts .share-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:-3px;margin-right:5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:6px 0;margin-top:6px}
.listitem{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0}
.listitem .ph{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg2)}
[data-report-kind] .ph svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
.listitem b{display:block;font-size:15px;min-width:0}
.listitem small{color:var(--muted);font-size:12px}
.listitem .pr{font-weight:800;font-size:16px;white-space:nowrap;text-align:right}
.listitem .pr small{display:block;font-weight:500}
.rank{width:34px;font-size:12px;font-weight:800;background:var(--chip);border-radius:8px;text-align:center;padding:2px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:4px;background:var(--chip);color:var(--ink2)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.grn{background:var(--green-soft);color:#1e6b41}
.tag.lv{background:var(--blue-soft);color:var(--blue)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg2 button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* 지도 제스처: 한 손가락/마우스 드래그 이동, 두 손가락 핀치·휠·더블클릭 확대 */
(function gestures(){
  const map = $("#map"), pts = new Map(); let last = null, moved = 0;
  map.addEventListener("pointerdown", e => {
    if (window.mapsService?.getMap() || e.target.closest(".pin")) return;
    map.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0; last = null; map.classList.add("drag");
  });
  map.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 1){ V.tx += e.clientX - prev.x; V.ty += e.clientY - prev.y; moved += Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y); applyView(); }
    else if (pts.size === 2){
      const [a,b] = [...pts.values()], r = rectOf();
      const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
      if (last){ V.tx += mx - last.mx; V.ty += my - last.my; zoomAt(mx, my, d/last.d); }
      last = {d, mx, my}; moved += 10;
    }
  });
  const end = e => { pts.delete(e.pointerId); last = null; if (!pts.size){ map.classList.remove("drag"); if (moved < 4 && !$("#peek").hidden) closePeek(); } };
  map.addEventListener("pointerup", end); map.addEventListener("pointercancel", end);
  map.addEventListener("wheel", e => { if(window.mapsService?.getMap()) return; e.preventDefault(); const r = rectOf(); zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015)); }, {passive:false});
  map.addEventListener("dblclick", e => { if(window.mapsService?.getMap()) return; if (e.target.closest(".pin")) return; const r = rectOf(); zoomAt(e.clientX-r.left, e.clientY-r.top, 1.5); });
  map.addEventListener("keydown", e => {
    const k = {ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]}[e.key];
    if (k && window.mapsService?.getMap()){ e.preventDefault(); window.mapsService.getMap().panBy(-k[0],-k[1]); return; }
    if (k){ e.preventDefault(); V.tx += k[0]; V.ty += k[1]; applyView(); }
    if (e.key === "+" || e.key === "="){ const r = rectOf(); zoomAt(r.width/2, r.height/2, 1.25); }
    if (e.key === "-"){ const r = rectOf(); zoomAt(r.width/2, r.height/2, 0.8); }
  });
  window.addEventListener("resize", applyView);
})();

const SAMPLE_NICKS=["홍대 알뜰러","티끌 수집가","망원 산책러","연남 탐험가","합정 짠돌이","신촌 대학생","가성비 헌터","무료 전시 덕후"];
const hashNum = str => [...String(str)].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);
const starStr = n => "★".repeat(n)+"☆".repeat(5-n);
const dotDate = iso => { if(!iso) return ""; const d=new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const topStars = it => it.cnt ? ` <span class="addr-star">★ ${it.star.toFixed(1)}</span><span class="addr-cnt">(${it.cnt})</span>` : ` <span class="addr-cnt">평가 없음</span>`;
const reviewType = () => "event";
// DB 리뷰 + 예시 리뷰를 합쳐 평균 별점과 평가 수를 계산한다. 기존 식당 예시 평점(cnt·star)은 기본값으로 함께 반영
function applyReviews(it){
  const ds=window.dataService;
  if(!it.baseInit){ it.baseInit=true; if(typeof it.cnt==="number"&&it.cnt>0){ it.baseCnt=it.cnt; it.baseStar=it.star||0; } }
  const db=ds.getReviews(it.id).map(r=>({id:r.id,user_id:r.user_id,n:ds.nicknameOf(r.user_id,r.nickname||"이름 없음"),r:r.rating||0,c:r.text||"",at:r.created_at,likes:ds.getLikes(r.id).length,liked:ds.likedByMe(r.id),flagged:ds.flaggedByMe(r.id),mine:r.user_id===ds.userId()}));
  const samples=(it.sampleComments||[]).map((c,i)=>({id:null,sample:true,n:SAMPLE_NICKS[hashNum(it.id+i)%SAMPLE_NICKS.length],r:3+hashNum(c.c)%3,c:c.c,t:c.t,likes:hashNum(c.c+it.id)%6,at:""}));
  it.reviewList=[...db,...samples];
  const rated=db.filter(r=>r.r);
  let cnt,sum;
  if(it.baseCnt){ cnt=it.baseCnt+rated.length; sum=it.baseStar*it.baseCnt+rated.reduce((a,r)=>a+r.r,0); }
  else { const all=[...rated,...samples]; cnt=all.length; sum=all.reduce((a,r)=>a+r.r,0); }
  it.cnt=cnt; it.star=cnt?sum/cnt:0;
}
function reviewSection(it){

  };

      ?`<b class="rv-avg">${it.star.toFixed(1)}</b><div><div class="rv-sum-stars" aria-label="5점 만점에 ${it.star.toFixed(1)}점">${starStr(full)}</div><small>평가 ${it.cnt}개</small></div>`

    ${list.map(item).join("") || '<p class="note">아직 리뷰가 없어요. 첫 리뷰를 남겨주세요.</p>'}</div>`;

/* ⑤ 위치 방문 인증 → 티끌 + 광고 보너스 */
function haversineM(aLat,aLng,bLat,bLng){
  const R=6371000, r=Math.PI/180, dLat=(bLat-aLat)*r, dLng=(bLng-aLng)*r;
  const q=Math.sin(dLat/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(q));
}

function refreshNotifications(){
  if(window.dataService.mode==="connecting" || window.dataService.mode==="remote-error") return;
  const now = [];
  if(S.prefs.end){ events.filter(e=>S.saved.has(e.id)&&soon(e)).forEach(e=>now.push({id:`end-${e.id}`,kind:"곧 종료",text:`찜한 ${e.name}이 곧 종료돼요`,time:"지금",read:false,target_id:e.id})); }
  if(S.prefs.free){ events.filter(e=>(e.price_min===0||e.price===0)&&S.prefs.genres.has(e.genre4||e.genre)).slice(0,5).forEach(e=>now.push({id:`free-${e.id}`,kind:"새 무료 행사",text:`관심 분야 무료 행사 ${e.name}`,time:"지금",read:false,target_id:e.id})); }
  if(S.prefs.judge){ judgeList.filter(j=>j.status==="승격"&&j.ref&&(!j.user_id||j.user_id===window.dataService.userId())).forEach(j=>now.push({id:`judge-${j.id}`,kind:"제보 승격",text:`내 제보 ${j.name}이 확인을 받아 지도에 정식으로 올라갔어요`,time:"지금",read:false,target_id:j.ref})); }
  const tmr = addFilterDays(REC_TODAY, 1);
  Object.entries(diary().plans).forEach(([pid, date]) => { const it = findAny(pid); if (!it) return;
    if (date === tmr) now.push({id:`plan-${pid}-${date}-d1`, kind:"내일 갈 곳", text:`내일 ${it.name}에 가기로 했어요`, time:"지금", read:false, target_id:pid});
    if (date === REC_TODAY) now.push({id:`plan-${pid}-${date}-d0`, kind:"오늘 갈 곳", text:`오늘 ${it.name}에 가는 날이에요`, time:"지금", read:false, target_id:pid}); });
  const map=new Map(); [...S.notis,...now].forEach(n=>{ if(!map.has(n.id)) map.set(n.id,n); });
  S.notis=[...map.values()].slice(0,30); if(window.dataService) window.dataService.saveNotifications(S.notis);
}

  });
}

function searchResults(q){

function receiptEntries(month){

    case "stepBtn": if(needLogin("만보기 적립")) break; { const n=Math.floor(S.steps/1000)-S.stepClaimed; S.stepClaimed+=n; addTikkle(n*10,`만보기 ${n}구간 (데모 예시)`); renderPage(); break; }
    case "adBtn": if(!needLogin("광고 보고 티끌 받기")) adFlow(); break;
    case "drawBtn": if(needLogin("티끌드로우 응모")) break; { S.tickets--; const win = Math.random()<0.15; renderPage(); toast(win?"🎉 당첨! 커피 쿠폰이 쿠폰함에 들어갔어요 (데모)":"아쉽게도 꽝이에요. 다음 기회에!"); break; }
  }
});
$("#scrim").addEventListener("click", ev => { if (ev.target.id==="scrim") closeSheet(); });
document.addEventListener("change", ev => {
  if (ev.target.id === "hideSamples"){ S.hideSamples=ev.target.checked; persistPreferences(); render(); toast(S.hideSamples?"실제 입력 장소만 보여줘요.":"예시 데이터도 함께 보여줘요."); }
  if (ev.target.id === "demoMode"){ S.demoMode=ev.target.checked; persistPreferences(); if(window.dataService.mode==="remote") applyDataState(); $("#demoModeBadge").hidden=!S.demoMode; toast(S.demoMode?"시연 모드를 켰어요.":"일반 모드로 전환했어요."); }
  if (ev.target.id === "benSw"){ S.benefit=ev.target.checked; if(window.dataService) window.dataService.update("benefit_enabled",S.benefit); render(); }
});

document.addEventListener("keydown", ev => { if (ev.key==="Escape"){ if (!$("#scrim").hidden) closeSheet(); else if (!$("#peek").hidden) closePeek(); } });
function persistPreferences(){
  window.dataService.update("app_state",{hideSamples:S.hideSamples,demoMode:S.demoMode,bells:[...S.bells],prefs:{...S.prefs,regions:[...S.prefs.regions],genres:[...S.prefs.genres]}});
}
function applyDataState(){
  const ds=window.dataService;
  if(ds.mode!=="remote") return;
  const merge=(destination,rows)=>{ destination.splice(0,destination.length,...rows); };
  const culture=new Map(retainedCultureSamples.map(e=>[e.id,e]));
  ds.getEvents().forEach(e=>culture.set(e.id,e));
  merge(events,[...culture.values()]);
  const benefits=ds.getBenefits();
  events.forEach(e=>{
    e.comments=e.meta?.comments||e.comments||[]; e.votes=e.votes||{went:0,ended:0,wrong:0}; e.hours=e.hours||"원문에서 확인"; e.entry=e.entry||"원문에서 확인";
    // 공공데이터 행사는 요금 문구에서 자동으로 뽑은 혜택가에, 사용자가 직접 입력한 혜택을 더한다
    const auto=e.is_public_culture&&Array.isArray(e.benefit_rules)?e.benefit_rules.map(r=>({...r,auto_extracted:true})):[];
    e.ben=[...auto,...legalRules(e),...venueRules(e),...benefits.filter(r=>r.event_id===e.id).map(r=>({t:r.type,v:r.value,p:r.price_after,l:r.label,auto_extracted:r.auto_extracted}))];
    e.benefit_records=benefits.filter(r=>r.event_id===e.id);
  });
  events.forEach(it=>{
    if(!it.sampleComments) it.sampleComments=(it.meta?.comments||it.comments||[]).filter(c=>!c.id);
    applyReviews(it); it.votes=it.votes||{went:0,ended:0,wrong:0};
    if(it.x==null||it.y==null){ if(!hasCultureCoordinates(it)) return; const point=({x:500+((it.lng||126.9245)-126.9245)/0.000018,y:660-((it.lat||37.5572)-37.5572)/0.000012}); it.x=point.x; it.y=point.y; }
  });
  S.profile=ds.getProfile(); S.benefit=Boolean(ds.read().benefit_enabled);
  S.saved=new Set(ds.getSaved().map(r=>r.target_id)); S.notis=ds.getNotifications(); S.tikkle=ds.getBalance();
  const preferences=ds.read().app_state;
  if(preferences){ S.hideSamples=Boolean(preferences.hideSamples); S.demoMode=preferences.demoMode??true; S.bells=new Set(preferences.bells||[]); if(preferences.prefs){ S.prefs={...S.prefs,...preferences.prefs,regions:new Set(preferences.prefs.regions||[]),genres:new Set(preferences.prefs.genres||[])}; } }
  const baseJudges=judgeList.filter(j=>/^j[123]$/.test(j.id));
  const reports=ds.getReports().map(r=>{
    const demoVotes=S.demoMode?(ds.read().demo_votes||[]).filter(v=>v.report_id===r.id):[];
    const right=r.yes+demoVotes.filter(v=>v.vote==="right").length,ended=r.ended+demoVotes.filter(v=>v.vote==="ended").length,wrong=r.wrong+demoVotes.filter(v=>v.vote==="wrong").length;
    const status=right>=3&&right>ended+wrong?"승격":r.status==="통과"?"승격":r.status==="종료"?"종료":"확인 중";
    const target=findAny(r.id); if(target){ target.isNew=status!=="승격"; if(r.tab==="문화"){ target.src=status==="승격"?"승격 제보":"사용자 제보"; target.status=status; target.votes={went:right,ended,wrong}; } }
    return {id:"j"+r.id,report_id:r.id,user_id:r.user_id,nick:ds.nicknameOf(r.user_id,r.meta?.nickname||""),ref:r.id,kind:r.tab,name:r.name,price:r.price,area:r.address,time:"제보",submittedAt:Date.parse(r.created_at),expiresAt:Date.parse(r.created_at)+7*86400000,right,ended,wrong,status,voters:{}};
  });
  judgeList.splice(0,judgeList.length,...reports,...baseJudges);
  S.judged=new Set((ds.read().report_votes||[]).filter(v=>v.user_id===ds.userId()).map(v=>"j"+v.report_id));
  render();
}
window.addEventListener("geojimap:data-error",ev=>{
  const messages={anonymous_provider_disabled:"Supabase 익명 로그인을 켜 주세요.","23505":"이미 저장된 정보예요. 새로고침해 확인해 주세요.","42501":"서버 저장 권한을 확인해 주세요."};
  if(String(ev.detail.code||"").startsWith("auth_")) return; // 계정 오류는 가입·로그인 시트 안에 표시
  toast(messages[ev.detail.code]||"Supabase 저장·조회에 실패했어요. 연결 상태를 확인해 주세요.");
});

  if (ev.target.id !== "benSw") return;
