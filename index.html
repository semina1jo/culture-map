<title>가문의 영광 · 가성비 문화생활 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&text=%EC%BB%AC%EC%B2%98%EB%A7%B5&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 전체 화면 지도 위에 헤더·필터칩·떠 있는 버튼·하단 메뉴. 다른 탭은 지도 위 전체 페이지, 카드·시트는 아래에서 올라옴 */
:root{
  color-scheme:light;
  /* 컬처맵 팔레트: 짙은 숲색 잉크 + 올리브 포인트 + 따뜻한 종이색. 가격 단계는 민트(무료)·레몬(저가)·라일락(만 원 이하) */
  --ink:#1F2B22; --ink2:#4A584D; --muted:#8B958C; --line:#E6EADF; --chip:#F1F4EA; --white:#fff; --outer:#E4E9DC;
  --accent:#6F8F2E; --accent-soft:#EDF3DC; --paper:#FFFAF3; --grn:#0E9F75;
  --gold:#F0A500; --gold-soft:#FFF3CC; --green:#13B386; --green-soft:#DDF6EC; --blue:#7B61FF; --blue-soft:#EEEAFF; --red:#F0445A; --red-soft:#FFE5E9;
  --map-land:#f3f2ee; --map-road:#fff; --map-case:#e4e1da; --map-park:#d6ead0; --map-water:#cde2f4; --map-label:#9a9a9a;
  --f:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet:focus,.sheet:focus-visible{outline:none}
.rv-gt{font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.my-rv{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.my-rv-t{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}.my-rv-t b{display:block;font-size:14.5px}.my-rv-t small{color:var(--muted);font-size:12px}.my-rv-a{display:flex;gap:6px;flex:none}.blk.danger{background:var(--red);border-color:var(--red)}
.rv-empty{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 0;color:var(--muted);font-size:12.5px}.rv-empty u{color:var(--ink2)}
.rv-form label .note{font-weight:500;margin-left:4px;font-size:11.5px}.rv-form .sit-vote{margin:4px 0 2px}.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.rv-meta{display:block;color:var(--muted);font-size:12px;margin:2px 0 4px}.rv-goods{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.rv-goods .tag{margin:0}.rv-photo{display:block;max-width:160px;max-height:160px;border-radius:10px;margin:6px 0;object-fit:cover}.rv-agg{margin:0 0 10px}.rv-agg small{color:var(--muted);font-size:12px}
.hrs{font-weight:700}.hrs.grn{color:var(--accent)}.hrs.red{color:var(--red)}.rowi b.hrs{display:block}.hrs-raw{display:block;color:var(--ink2);font-size:13px}
.gu-chips .opt{gap:6px}.gu-chips .opt button{padding:6px 11px;font-size:12.5px}
.flab .note{font-weight:500;margin-left:6px;font-size:11.5px}
.task>.out,.task>.blk,.task>a.out{flex:none;white-space:nowrap}
.go small,.dc small{white-space:normal}.nowrap{white-space:nowrap}
.verify .note{display:block}
.back-link{display:block;margin:14px auto 0;text-align:center}
form select{height:42px}

.app{position:relative;height:100%;max-height:880px;max-width:420px;margin:0 auto;overflow:hidden;border-radius:24px;background:var(--map-land);box-shadow:0 10px 40px rgba(0,0,0,.18)}
/* 휴대폰에서는 가상 폰 테두리 없이 화면 전체를 쓴다 */
@media (max-width:520px), (max-height:500px) and (pointer:coarse){
  body{padding:0}
  .app{max-width:none;max-height:none;height:100%;border-radius:0;box-shadow:none}
}
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none}
.gmap{position:absolute;inset:0 0 70px;background:var(--map-land);z-index:0}
.gmap.ready{background:transparent}
.mapStatus{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:1;background:rgba(255,255,255,.92);border-radius:12px;padding:9px 12px;color:var(--ink2);font-size:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:230px}
.world{z-index:2;pointer-events:none}
.pin{pointer-events:auto}
.me-dot{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%) scale(var(--inv,1));z-index:3;pointer-events:none}
.me-dot i{position:relative;display:block;width:100%;height:100%;border-radius:50%;background:#2f7bf6;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);box-sizing:border-box}
.me-dot::before{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(47,123,246,.18);animation:mePulse 2s ease-out infinite}
.me-dot.demo i{background:#7a5cf0}
.me-dot.demo::before{background:rgba(122,92,240,.18)}
@keyframes mePulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1);opacity:0}}
.map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1000px;height:1400px;transform-origin:0 0;will-change:transform}
.world svg{position:absolute;left:0;top:0;width:1000px;height:1400px}
.r-case{stroke:var(--map-case);fill:none;stroke-linecap:round}
.r-road{stroke:var(--map-road);fill:none;stroke-linecap:round}
.park{fill:var(--map-park)} .water{fill:var(--map-water)}
.lbl{fill:var(--map-label);font-size:11px;font-family:var(--f)}
.stn{fill:#fff;stroke:#666;stroke-width:1.5}

.head{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 16px 10px;background:linear-gradient(#fff 72%,rgba(255,255,255,0))}
.title{display:flex;align-items:center;justify-content:space-between}
.title h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
span.demo{font-size:10.5px;color:var(--muted);margin-left:8px;font-weight:500;vertical-align:middle;border:1px solid var(--line);border-radius:6px;padding:1px 5px;letter-spacing:0}
.round{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center;position:relative}
.round svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
.layers{display:flex;gap:16px;margin:10px 2px 8px}
.layers button{border:0;background:none;padding:2px 0;font-size:15px;font-weight:700;color:var(--muted);position:relative}
.layers button[aria-pressed="true"]{color:var(--ink)}
.layers button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2.5px;border-radius:2px;background:var(--ink)}
.new{font-size:9.5px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:0 4px;margin-left:3px;vertical-align:3px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.13);border-radius:12px;height:38px;padding:0 12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.chip .car{width:12px;height:12px;stroke-width:2.4}
.chip.icon{width:38px;padding:0;justify-content:center}
.chip.on{background:var(--ink);color:#fff}
.chip.on svg{stroke:#fff}

.pin{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .p{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--bd);border-radius:999px;padding:3px 11px 3px 5px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.pin .e{width:30px;height:30px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:14px;flex:none;position:relative;margin:-2px 0 -2px -1px}
.pin .e img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block;border-radius:50%}
.pin .e .gb{z-index:1;position:absolute;right:-4px;bottom:-3px;min-width:15px;height:15px;padding:0 2px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(31,43,34,.15);font-size:9px;line-height:15px;text-align:center;font-weight:800;color:var(--ink)}
.pin .e.noimg .gb{position:static;box-shadow:none;background:none;font-size:14px}
.pin.sel .e{width:36px;height:36px}
.pin .s{margin-top:-3px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--ink2)}
.pin.sel{z-index:4}
.pin.sel .p{background:var(--ink);color:#fff;border-color:var(--ink)}
.pin.rep .p{border-style:dashed}
/* 문화 탭: 예시(데모) 데이터는 연하게, 공공 API 데이터가 위로 */
.pin.demo{opacity:.75;z-index:1}
.pin.demo.sel{opacity:1;z-index:4}
/* 상설 시설·무료 공간: 축소 상태에서는 작은 점 (2026-11-16) */
.pdot{position:absolute;width:12px;height:12px;padding:0;border-radius:50%;background:var(--bd,var(--green));border:2px solid #fff;box-shadow:0 1px 3px rgba(31,43,34,.3);transform:translate(-50%,-50%);z-index:1;pointer-events:auto;cursor:pointer}
.pdot::before{content:"";position:absolute;inset:-9px}
.pdot.demo{opacity:.6}
.cal-g button.wed:not(.on){color:#9A6B00}
.chip.wday{background:var(--gold-soft,#FFF1C9);color:var(--ink);border-color:transparent;font-weight:700;cursor:default;white-space:nowrap}
/* 범례: '내 위치' 버튼 바로 밑, 작게 (2026-11-16) */
/* 범례: '내 위치' 버튼 오른쪽 아래에 작게. 버튼 바로 밑은 구글 로고 자리라 가리면 안 됨 */
.loc-wrap{position:relative}
.mapLegend{position:absolute;left:68px;bottom:0;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.85);border-radius:999px;padding:0 5px;font-size:9px;font-weight:600;line-height:12px;color:var(--muted);white-space:nowrap;pointer-events:none;min-height:12px}
.mapLegend.off{visibility:hidden}
.mapLegend .lg-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.listitem.demo{opacity:.75}
.t-free{--bd:var(--green);--bg2:var(--green-soft)}
.t-low{--bd:var(--gold);--bg2:var(--gold-soft)}
.t-mid{--bd:var(--blue);--bg2:var(--blue-soft)}
.t-unknown{--bd:#aaa;--bg2:#f1f1f1}
.more{position:absolute;left:50%;top:205px;transform:translateX(-50%);z-index:4;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.stack{position:absolute;right:12px;top:200px;z-index:4;display:flex;flex-direction:column;gap:8px}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.bottomctl{position:absolute;left:12px;right:12px;bottom:76px;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.bottomctl > *{pointer-events:auto}
.plus{width:52px;height:52px;border-radius:16px;border:0;background:var(--ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.plus svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none}
.plus-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.plus-wrap span{font-size:11px;font-weight:700;background:#fff;border-radius:999px;padding:1px 8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.legend{position:absolute;left:12px;bottom:138px;z-index:3;background:#fff;border-radius:10px;padding:4px 9px;font-size:11px;color:var(--ink2);box-shadow:0 1px 5px rgba(0,0,0,.12);display:flex;gap:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:2px solid var(--bd);background:var(--bg2);vertical-align:-1px}

.nav{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:8px 0 12px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:500}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}

.peek{position:absolute;left:12px;right:12px;bottom:76px;z-index:7;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;display:grid;grid-template-columns:72px 1fr;gap:4px 14px}

.peek .sub b{font-size:21px;font-weight:800;white-space:nowrap}
.peek .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.peek .foot span{color:var(--muted);font-size:12.5px}
.blk{border:0;background:var(--ink);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.out{border:1px solid var(--line);background:#fff;font-weight:700;border-radius:12px;padding:11px 16px}
.out.on{border-color:var(--ink);background:var(--chip)}
.sm{padding:7px 12px;font-size:13px;border-radius:10px}

.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 18px 22px}
.grab{width:38px;height:4px;border-radius:2px;background:#d5d5d5;margin:2px auto 14px}

.hero{height:132px;min-height:132px;max-height:132px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden;isolation:isolate}

.hero img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;border-radius:14px;z-index:0}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}

.rows{border-top:1px solid var(--line);margin-top:10px}

.sec{margin-top:18px}

.cmt{background:var(--chip);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:6px}

.sr-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px}

.sr-cancel{border:0;background:none;font-weight:700;color:var(--ink2);padding:8px 2px}
.sr-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;color:var(--ink2);margin:14px 0 6px}
.sr-h span{color:var(--muted);font-weight:700;margin-left:4px;margin-right:auto}
.sr-clear{border:0;background:none;color:var(--muted);font-size:12px}
.sr-chips{display:flex;flex-wrap:wrap;gap:6px}

.rv-avg{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em}
.rv-avg.muted{color:var(--muted)}
.rv-sum-stars{color:var(--gold);font-size:22px;letter-spacing:2px;line-height:1.1}

.rv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}

/* 지도 제스처: 한 손가락/마우스 드래그 이동, 두 손가락 핀치·휠·더블클릭 확대 */
(function gestures(){
  const map = $("#map"), pts = new Map(); let last = null, moved = 0;
  map.addEventListener("pointerdown", e => {
    if (window.mapsService?.getMap() || e.target.closest(".pin")) return;
    map.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0; last = null; map.classList.add("drag");
  });
  map.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 1){ V.tx += e.clientX - prev.x; V.ty += e.clientY - prev.y; moved += Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y); applyView(); }
    else if (pts.size === 2){
      const [a,b] = [...pts.values()], r = rectOf();
      const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
      if (last){ V.tx += mx - last.mx; V.ty += my - last.my; zoomAt(mx, my, d/last.d); }
      last = {d, mx, my}; moved += 10;
    }
  });
  const end = e => { pts.delete(e.pointerId); last = null; if (!pts.size){ map.classList.remove("drag"); if (moved < 4 && !$("#peek").hidden) closePeek(); } };
  map.addEventListener("pointerup", end); map.addEventListener("pointercancel", end);
  map.addEventListener("wheel", e => { if(window.mapsService?.getMap()) return; e.preventDefault(); const r = rectOf(); zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015)); }, {passive:false});
  map.addEventListener("dblclick", e => { if(window.mapsService?.getMap()) return; if (e.target.closest(".pin")) return; const r = rectOf(); zoomAt(e.clientX-r.left, e.clientY-r.top, 1.5); });
  map.addEventListener("keydown", e => {
    const k = {ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]}[e.key];
    if (k && window.mapsService?.getMap()){ e.preventDefault(); window.mapsService.getMap().panBy(-k[0],-k[1]); return; }
    if (k){ e.preventDefault(); V.tx += k[0]; V.ty += k[1]; applyView(); }
    if (e.key === "+" || e.key === "="){ const r = rectOf(); zoomAt(r.width/2, r.height/2, 1.25); }
    if (e.key === "-"){ const r = rectOf(); zoomAt(r.width/2, r.height/2, 0.8); }
  });
  window.addEventListener("resize", applyView);
})();

/* ===== 리뷰 사진 방문 확인 (2026-11-26) =====
   사진 파일의 촬영 정보(EXIF: 찍은 시각·위치)를 기기 안에서 읽어 행사 기간·장소와 대조한다.
   저장하는 사진은 줄여서 다시 만들기 때문에(shrinkPhoto) 위치 정보는 올라가지 않는다. 결과만 남긴다 */
async function readPhotoMeta(file){
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null; // JPEG만 (HEIC·PNG는 촬영 정보 없음으로 본다)
    let off = 2;
    while (off + 10 < v.byteLength) {

/* ⑤ 위치 방문 인증 */
function haversineM(aLat,aLng,bLat,bLng){
  const R=6371000, r=Math.PI/180, dLat=(bLat-aLat)*r, dLng=(bLng-aLng)*r;
  const q=Math.sin(dLat/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(q));
}

const OLD_REGION = {"홍대입구":"마포구","연남동":"마포구","서교동":"마포구","대현동":"서대문구"};
function eventGu(e){ if (e.gu) return e.gu; const hay = [e.place_addr, e.place, e.org_name].filter(Boolean).join(" "); return SEOUL_GU.find(g => hay.includes(g)) || null; }
const inRegion = e => !S.prefs.regions.size || S.prefs.regions.has(eventGu(e));
function refreshNotifications(){
  if(window.dataService.mode==="connecting" || window.dataService.mode==="remote-error") return;
  const now = [];
  if(S.prefs.end){ events.filter(e=>S.saved.has(e.id)&&!hideDemo(e)&&soon(e)).forEach(e=>now.push({id:`end-${e.id}`,kind:"곧 종료",text:`찜한 ${e.name}이 곧 종료돼요`,time:"지금",read:false,target_id:e.id})); }
  if(S.prefs.free){ events.filter(e=>!hideDemo(e)&&(e.price_min===0||e.price===0)&&S.prefs.genres.has(e.genre4||e.genre)&&inRegion(e)).slice(0,5).forEach(e=>now.push({id:`free-${e.id}`,kind:"새 무료 행사",text:`${eventGu(e)?eventGu(e)+" · ":""}관심 분야 무료 행사 ${e.name}`,time:"지금",read:false,target_id:e.id})); }
  const tmr = addFilterDays(REC_TODAY, 1);
  Object.entries(diary().plans).forEach(([pid, date]) => { const it = findAny(pid); if (!it) return;
    if (date === tmr) now.push({id:`plan-${pid}-${date}-d1`, kind:"내일 갈 곳", text:`내일 ${it.name}에 가기로 했어요`, time:"지금", read:false, target_id:pid});

  // 받침에 따라 이/가, 을/를을 붙인다
  const josa = (w, a, b) => { const c = String(w).trim().slice(-1).charCodeAt(0) - 0xAC00; return w + (c >= 0 && c <= 11171 && c % 28 ? a : b); };

// 주소 → 좌표. 구글 Geocoding API를 먼저 쓰고, 꺼져 있거나 못 찾으면 OpenStreetMap(Nominatim)으로 찾는다. 서울 범위 밖 결과는 버린다
const inSeoul = p => p && p.lat > 37.4 && p.lat < 37.72 && p.lng > 126.75 && p.lng < 127.2;
async function geocodeAddress(q){
  if (window.google?.maps?.Geocoder) {
    const g = await new Promise(res => new google.maps.Geocoder().geocode({ address: q, region: "kr" }, (r, st) => res(st === "OK" && r?.[0] ? { lat: r[0].geometry.location.lat(), lng: r[0].geometry.location.lng() } : null)));
    if (inSeoul(g)) return g;
  }
  for (const t of [...new Set([q, q.replace(/\s*\(.*?\)\s*/g, " ").replace(/\d+층.*$/, "").trim()])]) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(t)}`);
      const j = r.ok ? await r.json() : []; const p = j?.[0] ? { lat: +j[0].lat, lng: +j[0].lon } : null;
      if (inSeoul(p)) return p;
    } catch (_) {}
  }
  return null;
}

  });

function confirmPop({ title, body, ok = "확인", danger = false, onOk }){
  document.querySelector(".why-pop")?.remove();
  const host = $("#scrim").parentElement, box = document.createElement("div"); box.className = "why-pop";

  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };

  const norm = s => String(s||"").replace(/[\s\[\]()〈〉<>「」『』·.,]/g,"").toLowerCase();
  // 중복 후보: 공공데이터, 이미 지도에 있는 등록 장소, 다른 대기·승인 신청. 이름이 비슷하거나, 80m 안에서 같은 분야·겹치는 기간이면 표시
  const t0 = norm(r.title), myEvent = r.event_id ? `culture_events_${r.event_id}` : null;
  const nameLike = n => { const x = norm(n); return x && t0.length >= 3 && x.length >= 3 && (x.includes(t0) || t0.includes(x)); };
  const overlap = (s1, e1, s2, e2) => (!s1 || !s2) ? (!s1 && !s2) : (s1 <= (e2 || s2) && s2 <= (e1 || s1));
  const near = (lat, lng) => Number.isFinite(lat) && Number.isFinite(lng) && haversineM(r.lat, r.lng, lat, lng) <= 80;
  const dup = [
    ...events.filter(e => e.is_public_culture && e.id !== myEvent && !e.hidden && (nameLike(e.name) || (near(e.lat, e.lng) && (e.genre4 || e.genre) === r.category && overlap(r.start_date, r.end_date, e.start || null, e.end || null))))
      .map(e => ({ name: `${e.is_partner ? "등록 장소" : "공공데이터"} · ${e.name}` })),
    ...ADM.rows.filter(x => x.id !== r.id && (x.status === "대기" || x.status === "승인") && (nameLike(x.title) || (near(x.lat, x.lng) && x.category === r.category && overlap(r.start_date, r.end_date, x.start_date, x.end_date))))
      .map(x => ({ name: `${x.status === "대기" ? "검사 대기 신청" : "승인된 신청"} · ${x.title}` })),
  ].slice(0, 4);
  const info = [
    {k:"source_match", t:"날짜·가격을 예매·공식 안내 페이지와 대조", link: r.ticket_url || r.homepage_url},
    {k:"price_rule", t:"3만 원 기준 충족 (할인가 포함)", auto: okPrice ? "기준 충족" : "기준 초과", bad: !okPrice},
    {k:"no_dup", t:"이미 있는 정보와 겹치지 않음", auto: dup.length ? `겹칠 수 있는 정보 ${dup.length}건` : "겹치는 정보 없음", bad: dup.length > 0, dup},
    {k:"location", t:"지도 위치와 주소가 맞음", map: `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`},
  ];
  return { proof, info };
}

const RECENT_KEY = "geojimap-recent-search";
function recentSearches(){ try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]").slice(0, 6); } catch (_) { return []; } }
function saveRecentSearch(q){
  q = String(q || "").trim(); if (!q) return;
  try { localStorage.setItem(RECENT_KEY, JSON.stringify([q, ...recentSearches().filter(x => x !== q)].slice(0, 6))); } catch (_) {}
}
const searchNorm = v => String(v || "").toLowerCase().replace(/\s+/g, "");
function searchPool(){
  const culture = events.filter(e => !e.hidden && !hideDemo(e) && (isAlwaysOpen(e) || !e.end || e.end >= FILTER_TODAY) && hasCultureCoordinates(e)).filter(e => { const p = cultureFilterPrice(e); return p != null && p <= PRICE_CAP; })
    .map(e => ({ it: e, kind: "문화", emoji: EMOJI[e.genre] || "🎫", sub: [e.genre, e.place].filter(Boolean).join(" · "), price: priceText(e), price0: cultureFilterPrice(e), hay: [e.name, e.place, e.genre, e.raw_category, e.source, e.fee_text, e.place_addr].join(" ") }));
  return culture;
}
function searchResults(q){
  const tokens = String(q || "").trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const b = viewBounds();
  return searchPool().filter(r => {
    const hay = searchNorm(r.hay + " " + r.kind);
    return tokens.every(t => searchNorm(t) === "무료" ? (r.price0 === 0 || hay.includes("무료")) : hay.includes(searchNorm(t)));
  }).map(r => ({ ...r, starts: searchNorm(r.it.name).startsWith(searchNorm(tokens[0])), dist: distM(r.it, b) }))
    .sort((a, c) => (c.starts - a.starts) || (a.dist - c.dist)).slice(0, 60);
}
function renderSearch(){

const DOW_KO = ["일","월","화","수","목","금","토"];
function omwData(id, date){

/* 이 기록에서 값이 없는 항목은 칩을 눌러도 넣을 게 없다 */
function omwAvail(D, k){

async function drawOmw(c, D, P, src){

  const reports=ds.getReports().map(r=>{
    const demoVotes=S.demoMode?(ds.read().demo_votes||[]).filter(v=>v.report_id===r.id):[];
    const right=r.yes+demoVotes.filter(v=>v.vote==="right").length,ended=r.ended+demoVotes.filter(v=>v.vote==="ended").length,wrong=r.wrong+demoVotes.filter(v=>v.vote==="wrong").length;
    const status=right>=3&&right>ended+wrong?"승격":r.status==="통과"?"승격":r.status==="종료"?"종료":"확인 중";
    const target=findAny(r.id); if(target){ target.isNew=status!=="승격"; if(r.tab==="문화"){ target.src=status==="승격"?"승격 제보":"사용자 제보"; target.status=status; target.votes={went:right,ended,wrong}; } }
    return {id:"j"+r.id,report_id:r.id,user_id:r.user_id,nick:ds.nicknameOf(r.user_id,r.meta?.nickname||""),ref:r.id,kind:r.tab,name:r.name,price:r.price,area:r.address,time:"제보",submittedAt:Date.parse(r.created_at),expiresAt:Date.parse(r.created_at)+7*86400000,right,ended,wrong,status,voters:{}};
  });
  judgeList.splice(0,judgeList.length,...reports,...baseJudges);
  S.judged=new Set((ds.read().report_votes||[]).filter(v=>v.user_id===ds.userId()).map(v=>"j"+v.report_id));
  render();
}
window.addEventListener("geojimap:data-error",ev=>{
  const messages={anonymous_provider_disabled:"Supabase 익명 로그인을 켜 주세요.","23505":"이미 저장된 정보예요. 새로고침해 확인해 주세요.","42501":"서버 저장 권한을 확인해 주세요."};
  if(String(ev.detail.code||"").startsWith("auth_")) return; // 계정 오류는 가입·로그인 시트 안에 표시
  toast(messages[ev.detail.code]||"Supabase 저장·조회에 실패했어요. 연결 상태를 확인해 주세요.");
});
window.addEventListener("geojimap:account-change",()=>{ S.subLoaded=false; window.dataService.checkAdmin(); loadMyResults(); if(S.tab==="me") renderPage(); });
// 내 등록 신청·신고 결과를 불러와 알림에 반영한다
async function loadMyResults(){
  const ds = window.dataService; if (!ds || ds.account().isGuest) return;
  await Promise.all([ds.listSubmissions(false), ds.listCultureReports(false)]);
  refreshNotifications(); $("#notiDot").hidden = !S.notis.some(n => !n.read && !hideDemoNoti(n));
}
window.addEventListener("geojimap:admin-change",()=>{ admRestore(); if(S.tab==="me"||S.tab==="admin") renderPage(); });
window.addEventListener("geojimap:data-ready",applyDataState);
render();
window.dataService.ready.then(result=>{ if(result.ok && window.dataService.takeRecovery()){ applyDataState(); S.noticeShown=true; S.tab="me"; render(); newPasswordSheet(); return; } if(result.ok){ applyDataState(); const notice=window.dataService.takeAuthNotice(); if(notice){ S.noticeShown=true; toast(notice); if(!isGuest()){ S.tab="me"; render(); } } else if(result.mode==="remote") toast("Supabase 연결 완료 · 데이터를 불러왔어요."); } else toast("Supabase 연결이 완료되지 않았어요. 익명 인증과 환경변수를 확인해 주세요."); });
if (window.mapsService) {
  window.mapsService.onChange(applyView);
  // 지도를 움직이다 멈추면 화면 안의 핀만 다시 그린다
  window.mapsService.onIdle(() => { if (S.tab === "map") renderMap(); });
  window.mapsService.init().then(applyView);
}
// 이미 위치 권한을 허용한 기기라면 들어오자마자 내 위치 점을 표시한다 (권한을 새로 묻지는 않음)
try { navigator.permissions?.query({ name: "geolocation" }).then(p => { if (p.state === "granted") startWatch(); }).catch(() => {}); } catch (_) {}
centerOn(500, 660, 0.72);
setTimeout(() => { if(!S.noticeShown) toast("지도를 끌어서 움직이고, 두 손가락이나 휠로 확대해 보세요"); }, 300);

document.addEventListener("change", ev => {
  if (ev.target.id !== "benSw") return;
  if (!S.profile){ ev.target.checked = false; profileSheet(true); toast("먼저 내 혜택 정보를 입력해 주세요."); return; }
  S.benefit = ev.target.checked; render(); toast(S.benefit ? "내 혜택 적용을 켰어요." : "내 혜택 적용을 껐어요. 원래 가격으로 보여줘요.");
});
